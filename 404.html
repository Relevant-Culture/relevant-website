  :root{
    --blue:#1F06F9;
    --ink:#0A0A12;
    --paper:#FFFFFF;
    --muted:#63637a;
    --line:rgba(10,10,18,.13);
    --display:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{padding:24px clamp(20px,4vw,56px);}
  .logo{display:inline-flex;text-decoration:none;}
  .logo img{display:block;height:32px;width:auto;}
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px clamp(20px,6vw,56px) 64px;
  }
  .code{
    font-family:var(--mono);font-size:clamp(52px,10vw,96px);font-weight:600;color:var(--blue);
    line-height:1;letter-spacing:-.02em;margin-bottom:8px;
  }
  h1{font-size:clamp(22px,3vw,30px);font-weight:700;margin:0 0 14px;letter-spacing:-.01em;}
  p.msg{color:var(--muted);font-size:16px;line-height:1.6;max-width:52ch;margin:0 auto 6px;}
  .lang-block{margin-bottom:22px;}
  .lang-tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;display:block;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:20px;
    padding:13px 24px;border-radius:100px;font-weight:600;font-size:14.5px;
    text-decoration:none;background:var(--blue);color:#FAFAFC;border:1.5px solid var(--blue);
    transition:transform .18s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  footer{padding:20px clamp(20px,4vw,56px);text-align:center;color:var(--muted);font-size:13px;}
</style>
